# Patient 360 Synthetic Data Generator Configuration
# All data generated by this kit is FAKE. No real patient data, no production schemas.

brands:
  - name: MEDFIRST
    label: MedFirst Healthcare
    patient_count: 500
  - name: CAREPLUS
    label: CarePlus Medical Group
    patient_count: 500
  - name: HEALTHBRIDGE
    label: HealthBridge Network
    patient_count: 500

# Intentional collision strategy: same source_patient_id across brands
# referring to DIFFERENT real people. This forces global ID strategy.
collision_count: 50

# Patients duplicated across brands (same person, different brand records)
# Forces identity resolution to do real work.
cross_brand_duplicates: 80

# Pediatric patients (age < 18) — drives guardian routing test
pediatric_pct: 0.15

# Edge cases to inject
edge_cases:
  twins_same_address: 10
  family_shared_email: 20
  changed_phone: 30
  changed_last_name: 15
  name_typos: 25
  missing_email: 40
  missing_phone: 30

# Providers
provider_count: 60
providers_per_brand: 20

# Clinical categories
clinical_categories:
  - Diabetes
  - Cardiac
  - Pediatric Wellness
  - Annual Wellness
  - Mental Health
  - Chronic Respiratory
  - Cancer Screening

# Engagement event volume
engagement_events_per_patient_avg: 8

# Output
output_dir: ../data
seed: 42  # Reproducible runs
